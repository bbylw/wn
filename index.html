<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<script>
  // 仅用于避免主题闪烁：在首次绘制前应用已保存的配色偏好。
  try {
    var storedScheme = localStorage.getItem('color-scheme');
    if (storedScheme === 'light' || storedScheme === 'dark') {
      document.querySelector('meta[name="color-scheme"]').content = storedScheme;
    }
  } catch (error) {}
</script>
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="简洁优雅的新拟物风格网址导航页，支持实时搜索与深色模式。">
<title>White navigation page · 白色导航页</title>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root {
  color-scheme: light dark;

  /* 颜色令牌：分别定义浅色与深色值，并用 light-dark() 自动切换 */
  --primary-light: #6200ee;
  --primary-dark: #b388ff;
  --secondary-color: #03dac6;
  --background-light: #e0e5ec;
  --background-dark: #1a1a1a;
  --surface-light: #e0e5ec;
  --surface-dark: #2a2a2a;
  --on-surface-light: #1d1d1d;
  --on-surface-dark: #ffffff;
  --on-primary-color: #ffffff;
  --neumorphic-light-light: #ffffff;
  --neumorphic-light-dark: #3a3a3a;
  --neumorphic-dark-light: #a3b1c6;
  --neumorphic-dark-dark: #151515;

  /* 回退方案：不支持 light-dark() 的浏览器跟随系统配色 */
  --primary-color: var(--primary-light);
  --background-color: var(--background-light);
  --surface-color: var(--surface-light);
  --on-surface-color: var(--on-surface-light);
  --neumorphic-light: var(--neumorphic-light-light);
  --neumorphic-dark: var(--neumorphic-dark-light);

  @media (prefers-color-scheme: dark) {
    --primary-color: var(--primary-dark);
    --background-color: var(--background-dark);
    --surface-color: var(--surface-dark);
    --on-surface-color: var(--on-surface-dark);
    --neumorphic-light: var(--neumorphic-light-dark);
    --neumorphic-dark: var(--neumorphic-dark-dark);
  }

  @supports (color: light-dark(#ffffff, #000000)) {
    --primary-color: light-dark(var(--primary-light), var(--primary-dark));
    --background-color: light-dark(var(--background-light), var(--background-dark));
    --surface-color: light-dark(var(--surface-light), var(--surface-dark));
    --on-surface-color: light-dark(var(--on-surface-light), var(--on-surface-dark));
    --neumorphic-light: light-dark(var(--neumorphic-light-light), var(--neumorphic-light-dark));
    --neumorphic-dark: light-dark(var(--neumorphic-dark-light), var(--neumorphic-dark-dark));
  }

  /* 将 <meta name="color-scheme"> 手动覆盖映射回 CSS 色彩方案 */
  &:has(> head > meta[name="color-scheme"][content="dark"]) {
    color-scheme: dark;
  }
  &:has(> head > meta[name="color-scheme"][content="light"]) {
    color-scheme: light;
  }

  accent-color: var(--primary-color);
  scrollbar-color: light-dark(#6b7280, #9ca3af) light-dark(#e0e5ec, #2a2a2a);
}

body {
  font-family: 'Roboto', 'Noto Sans SC', sans-serif;
  background-color: var(--background-color);
  color: var(--on-surface-color);
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  margin: 0;
  padding: 20px;
  transition: background-color 0.3s, color 0.3s;
  box-sizing: border-box;
  line-height: 1.5;
  overflow-wrap: break-word;
}

h1,
h2,
h3 {
  text-wrap: balance;
}

.container {
  background-color: var(--surface-color);
  padding: 30px;
  border-radius: 20px;
  box-shadow:
    10px 10px 20px var(--neumorphic-dark),
    -10px -10px 20px var(--neumorphic-light);
  text-align: center;
  max-width: 1200px;
  width: 100%;
  position: relative;
}

.grid-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
  margin: 30px 0 0;
  padding: 0;
  list-style: none;
}

.grid-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  background-color: var(--surface-color);
  border-radius: 15px;
  padding: 20px;
  text-align: center;
  text-decoration: none;
  color: inherit;
  transition: box-shadow 0.3s ease;
  box-shadow:
    5px 5px 10px var(--neumorphic-dark),
    -5px -5px 10px var(--neumorphic-light);
  cursor: pointer;
}

.grid-item:hover {
  box-shadow:
    8px 8px 15px var(--neumorphic-dark),
    -8px -8px 15px var(--neumorphic-light);
}

.icon {
  font-size: 2rem;
  margin-bottom: 15px;
  color: var(--primary-color);
}

h3 {
  margin: 0;
  font-size: 1rem;
  color: var(--on-surface-color);
}

.dark-mode-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  background-color: var(--surface-color);
  color: var(--on-surface-color);
  border: none;
  border-radius: 50%;
  width: 60px;
  height: 60px;
  font-size: 1.5rem;
  cursor: pointer;
  transition: box-shadow 0.3s ease;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow:
    5px 5px 10px var(--neumorphic-dark),
    -5px -5px 10px var(--neumorphic-light);
  z-index: 1000;
}

.dark-mode-toggle:hover {
  box-shadow:
    2px 2px 5px var(--neumorphic-dark),
    -2px -2px 5px var(--neumorphic-light);
}

.dark-mode-toggle:active {
  box-shadow:
    inset 2px 2px 5px var(--neumorphic-dark),
    inset -2px -2px 5px var(--neumorphic-light);
}

/* 根据当前色彩方案显示对应的模式图标 */
.dark-mode-toggle .fa-sun {
  display: none;
}

@media (prefers-color-scheme: dark) {
  .dark-mode-toggle .fa-moon {
    display: none;
  }
  .dark-mode-toggle .fa-sun {
    display: inline-block;
  }
}

:root:has(> head > meta[name="color-scheme"][content="light"]) .dark-mode-toggle .fa-moon {
  display: inline-block;
}
:root:has(> head > meta[name="color-scheme"][content="light"]) .dark-mode-toggle .fa-sun {
  display: none;
}
:root:has(> head > meta[name="color-scheme"][content="dark"]) .dark-mode-toggle .fa-moon {
  display: none;
}
:root:has(> head > meta[name="color-scheme"][content="dark"]) .dark-mode-toggle .fa-sun {
  display: inline-block;
}

.search-container {
  margin-bottom: 30px;
}

.search-input {
  width: 70%;
  padding: 12px 20px;
  margin: 8px 0;
  box-sizing: border-box;
  border: none;
  border-radius: 25px;
  background-color: var(--surface-color);
  color: var(--on-surface-color);
  font-size: 1rem;
  box-shadow:
    inset 5px 5px 10px var(--neumorphic-dark),
    inset -5px -5px 10px var(--neumorphic-light);
  transition: box-shadow 0.3s ease;
}

.search-input:focus {
  outline: none;
  box-shadow:
    inset 8px 8px 15px var(--neumorphic-dark),
    inset -8px -8px 15px var(--neumorphic-light);
}

.category-title {
  font-size: 1.5rem;
  margin-top: 40px;
  margin-bottom: 20px;
  color: var(--primary-color);
  text-align: left;
}

/* 仅对键盘用户显示清晰的焦点环（对比度 >= 3:1） */
:where(a, button, input):focus-visible {
  outline: 3px solid var(--primary-color);
  outline-offset: 3px;
}

.search-input:focus-visible {
  outline-offset: 2px;
}

/* 屏幕阅读器专用文本 */
.visually-hidden:where(:not(:focus-within, :active)) {
  position: absolute !important;
  clip-path: inset(50%) !important;
  overflow: hidden !important;
  width: 1px !important;
  height: 1px !important;
  margin: -1px !important;
  padding: 0 !important;
  border: 0 !important;
  white-space: nowrap !important;
}

.skip-link {
  position: absolute;
  inset-block-start: 0.5rem;
  inset-inline-start: 0.5rem;
  z-index: 2000;
  padding: 0.75rem 1rem;
  border-radius: 0.75rem;
  background-color: var(--surface-color);
  color: var(--on-surface-color);
  font-weight: 700;
  text-decoration: none;
  translate: 0 -200%;
  box-shadow:
    3px 3px 6px var(--neumorphic-dark),
    -3px -3px 6px var(--neumorphic-light);
}

.skip-link:focus-visible {
  translate: 0 0;
}

main:focus-visible {
  outline: 3px solid var(--primary-color);
  outline-offset: 8px;
  border-radius: 20px;
}

/* 仅在用户没有减少动态效果偏好时启用位移动画 */
@media (prefers-reduced-motion: no-preference) {
  .grid-item {
    transition: box-shadow 0.3s ease, translate 0.3s ease, scale 0.15s ease;
  }
  .grid-item:hover {
    translate: 0 -5px;
  }
  .grid-item:active {
    scale: 0.98;
  }
  .skip-link {
    transition: translate 0.2s ease;
  }
}

/* 强制高对比色模式下用边框替代会消失的阴影，保留控件边界 */
@media (forced-colors: active) {
  .container,
  .grid-item,
  .dark-mode-toggle,
  .search-input {
    border: 1px solid CanvasText;
  }
  :where(a, button, input):focus-visible {
    outline: 3px solid Highlight;
  }
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" crossorigin referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
<a class="skip-link" href="#content">跳到主要内容</a>
<button class="dark-mode-toggle" type="button" aria-label="深色模式" aria-pressed="false">
  <i class="fas fa-moon" aria-hidden="true"></i>
  <i class="fas fa-sun" aria-hidden="true"></i>
</button>
<div class="container">
  <header>
    <h1>White navigation page</h1>
  </header>
  <search class="search-container">
    <label class="visually-hidden" for="site-search">搜索网站</label>
    <input type="search" id="site-search" class="search-input" placeholder="搜索..." autocomplete="off" spellcheck="false">
  </search>
  <p id="search-status" class="visually-hidden" role="status" aria-live="polite"></p>

  <main id="content" tabindex="-1">
    <section>
      <h2 class="category-title">搜索引擎和社交媒体</h2>
      <ul class="grid-container" id="searchSocialContainer" role="list"></ul>
    </section>

    <section>
      <h2 class="category-title">电子商务和购物</h2>
      <ul class="grid-container" id="ecommerceContainer" role="list"></ul>
    </section>

    <section>
      <h2 class="category-title">娱乐和流媒体</h2>
      <ul class="grid-container" id="entertainmentContainer" role="list"></ul>
    </section>

    <section>
      <h2 class="category-title">新闻和资讯</h2>
      <ul class="grid-container" id="newsContainer" role="list"></ul>
    </section>

    <section>
      <h2 class="category-title">生产力和工具</h2>
      <ul class="grid-container" id="productivityContainer" role="list"></ul>
    </section>
  </main>
</div>

<script>
const websites = [
  { name: "谷歌", icon: "fab fa-google", url: "https://www.google.com", category: "searchSocial" },
  { name: "YouTube", icon: "fab fa-youtube", url: "https://www.youtube.com", category: "entertainment" },
  { name: "脸书", icon: "fab fa-facebook", url: "https://www.facebook.com", category: "searchSocial" },
  { name: "亚马逊", icon: "fab fa-amazon", url: "https://www.amazon.com", category: "ecommerce" },
  { name: "推特", icon: "fab fa-twitter", url: "https://www.twitter.com", category: "searchSocial" },
  { name: "Instagram", icon: "fab fa-instagram", url: "https://www.instagram.com", category: "searchSocial" },
  { name: "领英", icon: "fab fa-linkedin", url: "https://www.linkedin.com", category: "searchSocial" },
  { name: "网飞", icon: "fas fa-play-circle", url: "https://www.netflix.com", category: "entertainment" },
  { name: "维基百科", icon: "fab fa-wikipedia-w", url: "https://www.wikipedia.org", category: "news" },
  { name: "Reddit", icon: "fab fa-reddit", url: "https://www.reddit.com", category: "searchSocial" },
  { name: "Twitch", icon: "fab fa-twitch", url: "https://www.twitch.tv", category: "entertainment" },
  { name: "Spotify", icon: "fab fa-spotify", url: "https://www.spotify.com", category: "entertainment" },
  { name: "eBay", icon: "fab fa-ebay", url: "https://www.ebay.com", category: "ecommerce" },
  { name: "微软", icon: "fab fa-microsoft", url: "https://www.microsoft.com", category: "productivity" },
  { name: "苹果", icon: "fab fa-apple", url: "https://www.apple.com", category: "ecommerce" },
  { name: "雅虎", icon: "fab fa-yahoo", url: "https://www.yahoo.com", category: "searchSocial" },
  { name: "抖音", icon: "fab fa-tiktok", url: "https://www.tiktok.com", category: "searchSocial" },
  { name: "Pinterest", icon: "fab fa-pinterest", url: "https://www.pinterest.com", category: "searchSocial" },
  { name: "CNN", icon: "fas fa-newspaper", url: "https://www.cnn.com", category: "news" },
  { name: "BBC", icon: "fas fa-tv", url: "https://www.bbc.com", category: "news" },
  { name: "Adobe", icon: "fab fa-slack", url: "https://www.adobe.com", category: "productivity" },
  { name: "Dropbox", icon: "fab fa-dropbox", url: "https://www.dropbox.com", category: "productivity" },
  { name: "GitHub", icon: "fab fa-github", url: "https://www.github.com", category: "productivity" },
  { name: "Stack Overflow", icon: "fab fa-stack-overflow", url: "https://stackoverflow.com", category: "productivity" },
  { name: "阿里巴巴", icon: "fas fa-shopping-bag", url: "https://www.alibaba.com", category: "ecommerce" },
  { name: "IMDb", icon: "fab fa-imdb", url: "https://www.imdb.com", category: "entertainment" },
  { name: "Etsy", icon: "fab fa-etsy", url: "https://www.etsy.com", category: "ecommerce" },
  { name: "Quora", icon: "fab fa-quora", url: "https://www.quora.com", category: "searchSocial" },
  { name: "Medium", icon: "fab fa-medium", url: "https://medium.com", category: "news" },
  { name: "纽约时报", icon: "fas fa-newspaper", url: "https://www.nytimes.com", category: "news" },
  { name: "福布斯", icon: "fas fa-chart-line", url: "https://www.forbes.com", category: "news" },
  { name: "爱彼迎", icon: "fab fa-airbnb", url: "https://www.airbnb.com", category: "ecommerce" },
  { name: "Booking.com", icon: "fas fa-hotel", url: "https://www.booking.com", category: "ecommerce" },
  { name: "猫途鹰", icon: "fab fa-tripadvisor", url: "https://www.tripadvisor.com", category: "ecommerce" },
  { name: "Zoom", icon: "fas fa-video", url: "https://zoom.us", category: "productivity" },
  { name: "Slack", icon: "fab fa-slack", url: "https://slack.com", category: "productivity" },
  { name: "Trello", icon: "fab fa-trello", url: "https://trello.com", category: "productivity" },
  { name: "Asana", icon: "fas fa-tasks", url: "https://asana.com", category: "productivity" },
  { name: "Udemy", icon: "fas fa-graduation-cap", url: "https://www.udemy.com", category: "productivity" },
  { name: "Coursera", icon: "fas fa-laptop", url: "https://www.coursera.org", category: "productivity" },
  { name: "PayPal", icon: "fab fa-paypal", url: "https://www.paypal.com", category: "ecommerce" },
  { name: "卫报", icon: "fas fa-shield-alt", url: "https://www.theguardian.com", category: "news" },
  { name: "路透社", icon: "fas fa-globe", url: "https://www.reuters.com", category: "news" },
  { name: "彭博社", icon: "fas fa-chart-bar", url: "https://www.bloomberg.com", category: "news" },
  { name: "Vimeo", icon: "fab fa-vimeo", url: "https://vimeo.com", category: "entertainment" },
  { name: "SoundCloud", icon: "fab fa-soundcloud", url: "https://soundcloud.com", category: "entertainment" },
  { name: "Shopify", icon: "fas fa-shopping-cart", url: "https://www.shopify.com", category: "ecommerce" },
  { name: "Behance", icon: "fab fa-behance", url: "https://www.behance.net", category: "searchSocial" },
  { name: "Dribbble", icon: "fab fa-dribbble", url: "https://dribbble.com", category: "searchSocial" },
  { name: "Canva", icon: "fas fa-palette", url: "https://www.canva.com", category: "productivity" }
];

const containers = {
  searchSocial: document.getElementById('searchSocialContainer'),
  ecommerce: document.getElementById('ecommerceContainer'),
  entertainment: document.getElementById('entertainmentContainer'),
  news: document.getElementById('newsContainer'),
  productivity: document.getElementById('productivityContainer')
};

function createGridItem(website) {
  const item = document.createElement('li');

  const link = document.createElement('a');
  link.className = 'grid-item';
  link.href = website.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';

  const icon = document.createElement('i');
  icon.className = website.icon + ' icon';
  icon.setAttribute('aria-hidden', 'true');

  const name = document.createElement('h3');
  name.textContent = website.name;

  link.append(icon, name);
  item.append(link);
  return item;
}

function populateGrid() {
  const fragments = new Map();

  for (const website of websites) {
    if (!fragments.has(website.category)) {
      fragments.set(website.category, document.createDocumentFragment());
    }
    fragments.get(website.category).append(createGridItem(website));
  }

  for (const [category, fragment] of fragments) {
    containers[category].append(fragment);
  }
}

const searchInput = document.getElementById('site-search');
const searchStatus = document.getElementById('search-status');
let gridItems = [];

function filterItems() {
  const query = searchInput.value.trim().toLocaleLowerCase('zh-CN');
  let matches = 0;

  for (const item of gridItems) {
    const isMatch = item.textContent.toLocaleLowerCase('zh-CN').includes(query);
    item.hidden = !isMatch;
    if (isMatch) matches++;
  }

  searchStatus.textContent = query
    ? (matches > 0 ? '找到 ' + matches + ' 个网站' : '没有找到相关网站')
    : '';
}

function initSearch() {
  gridItems = Array.from(document.querySelectorAll('.grid-container > li'));
  searchInput.addEventListener('input', filterItems);
}

/* 深色模式：通过 <meta name="color-scheme"> 驱动，CSS 负责配色 */
const schemeMeta = document.querySelector('meta[name="color-scheme"]');
const schemeToggle = document.querySelector('.dark-mode-toggle');
const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

function getStoredScheme() {
  try {
    const value = localStorage.getItem('color-scheme');
    return value === 'light' || value === 'dark' ? value : null;
  } catch (error) {
    return null;
  }
}

function getResolvedScheme() {
  return getStoredScheme() ?? (darkQuery.matches ? 'dark' : 'light');
}

function syncToggleState() {
  const isDark = getResolvedScheme() === 'dark';
  schemeToggle.setAttribute('aria-pressed', String(isDark));
}

function applyStoredScheme() {
  schemeMeta.content = getStoredScheme() ?? 'light dark';
  syncToggleState();
}

function toggleScheme() {
  const systemScheme = darkQuery.matches ? 'dark' : 'light';
  const currentScheme = getResolvedScheme();
  const nextScheme = currentScheme === 'dark' ? 'light' : 'dark';

  try {
    if (nextScheme === systemScheme) {
      localStorage.removeItem('color-scheme');
    } else {
      localStorage.setItem('color-scheme', nextScheme);
    }
  } catch (error) {}

  applyStoredScheme();
}

populateGrid();
initSearch();

schemeToggle.addEventListener('click', toggleScheme);
darkQuery.addEventListener('change', syncToggleState);
window.addEventListener('storage', (event) => {
  if (event.key === 'color-scheme') applyStoredScheme();
});
applyStoredScheme();
</script>
</body>
</html>
